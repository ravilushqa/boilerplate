# golangci-lint v2 configuration: https://golangci-lint.run/docs/configuration/file/
# Run with `make lint`; auto-fix formatting with `make fmt`.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - protogetter
    - revive
    - sloglint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: Use the corresponding os or io functions instead.
            - pkg: log$
              desc: Use log/slog with an injected *slog.Logger.
            - pkg: github.com/stretchr/testify
              desc: Use the testing package; compare complex values with github.com/google/go-cmp/cmp.
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf.
            - pkg: github.com/pkg/errors
              desc: Use errors and fmt.Errorf with %w.
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # Deps structs are passed by value on purpose
        - unnamedResult
        - whyNoLint # covered by nolintlint
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: var-naming
        - name: receiver-naming
        - name: redefines-builtin-id
    sloglint:
      kv-only: true
      no-global: all # inject *slog.Logger instead of using slog.Info & co.
      context: scope # use *Context methods when a context is available
      static-msg: true
      key-naming-case: snake

  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/ravilushqa/boilerplate

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
