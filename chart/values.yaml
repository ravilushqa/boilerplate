# Default values for the boilerplate chart.
# Every key is documented; render with `make helm-lint`.

replicaCount: 2

image:
  repository: ghcr.io/ravilushqa/boilerplate
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Container ports. Keep in sync with HTTP_ADDR, GRPC_ADDR and DEBUG_ADDR.
ports:
  http: 8080
  grpc: 50051
  debug: 8081

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# enable tls on the service (mounts the certificate secret)
tls:
  enabled: false
  # the name of the secret used to mount the certificate key pair
  secretName:

# create a cert-manager certificate (cert-manager required)
certificate:
  create: false
  # the issuer used to issue the certificate
  issuerRef:
    kind: ClusterIssuer
    name: self-signed
  # the hostname / subject alternative names for the certificate
  dnsNames:
    - boilerplate

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
probes:
  liveness:
    path: /livez
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2

# Must be longer than SHUTDOWN_TIMEOUT so in-flight requests can finish.
terminationGracePeriodSeconds: 30

# Prometheus Operator ServiceMonitor (requires the monitoring.coreos.com CRDs).
serviceMonitor:
  enabled: false
  interval: 15s
  additionalLabels: {}

# Environment variables passed to the container. See .env.example for all options.
env:
  ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT: 15s
