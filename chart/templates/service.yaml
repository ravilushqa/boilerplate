apiVersion: v1
kind: Service
metadata:
  name: {{ include "boilerplate.fullname" . }}
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
    - name: debug
      port: {{ .Values.ports.debug }}
      targetPort: debug
      protocol: TCP
  selector:
    {{- include "boilerplate.selectorLabels" . | nindent 4 }}
