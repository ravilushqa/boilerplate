apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "boilerplate.fullname" . }}-test-connection"
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "boilerplate.fullname" . }}:{{ .Values.ports.debug }}/readyz']
  restartPolicy: Never
